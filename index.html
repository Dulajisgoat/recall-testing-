<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-green: #10b981;
            --primary-hover: #059669;
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(16, 185, 129, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, rgba(16, 185, 129, 0.15), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.1), transparent 40%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h2 {
            font-weight: 600;
            font-size: 24px;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 8px;
        }

        .tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: rgba(16, 185, 129, 0.1);
            color: var(--primary-green);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }

        .submit-btn {
            width: 100%;
            background: var(--primary-green);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: var(--primary-hover);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            display: none;
        }

        .message.error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .message.success {
            display: block;
            background: rgba(16, 185, 129, 0.1);
            color: var(--primary-green);
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="header">
            <h2 id="formTitle">Welcome Back</h2>
            <p id="formSubtitle">Enter your details to sign in</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="tabSignIn" onclick="switchTab('signin')">Sign In</button>
            <button class="tab-btn" id="tabSignUp" onclick="switchTab('signup')">Create Account</button>
        </div>

        <form id="authForm" onsubmit="handleAuth(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            
            <button type="submit" class="submit-btn" id="submitBtn">Sign In</button>
        </form>

        <div id="messageBox" class="message"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vxbfpehldttiubjxyiyo.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_0zbsGw86YpDVxyqUhWrCoA_eI69dIyK';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentMode = 'signin';

        function switchTab(mode) {
            currentMode = mode;
            const title = document.getElementById('formTitle');
            const subtitle = document.getElementById('formSubtitle');
            const btn = document.getElementById('submitBtn');
            const msgBox = document.getElementById('messageBox');
            
            document.getElementById('tabSignIn').classList.remove('active');
            document.getElementById('tabSignUp').classList.remove('active');
            
            msgBox.className = 'message';
            msgBox.textContent = '';
            document.getElementById('password').value = '';

            if (mode === 'signin') {
                document.getElementById('tabSignIn').classList.add('active');
                title.textContent = 'Welcome Back';
                subtitle.textContent = 'Enter your details to sign in';
                btn.textContent = 'Sign In';
                document.getElementById('password').setAttribute('autocomplete', 'current-password');
            } else {
                document.getElementById('tabSignUp').classList.add('active');
                title.textContent = 'Create Account';
                subtitle.textContent = 'Sign up to get started';
                btn.textContent = 'Create Account';
                document.getElementById('password').setAttribute('autocomplete', 'new-password');
            }
        }

        async function handleAuth(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');
            const msgBox = document.getElementById('messageBox');

            btn.disabled = true;
            btn.textContent = 'Processing...';
            msgBox.className = 'message';
            
            try {
                let result;
                
                if (currentMode === 'signup') {
                    result = await supabase.auth.signUp({
                        email: email,
                        password: password
                    });
                } else {
                    result = await supabase.auth.signInWithPassword({
                        email: email,
                        password: password
                    });
                }

                if (result.error) throw result.error;

                msgBox.className = 'message success';
                if (currentMode === 'signup') {
                    msgBox.textContent = 'Account created successfully! You can now sign in.';
                    setTimeout(() => switchTab('signin'), 2000);
                } else {
                    msgBox.textContent = 'Successfully signed in!';
                }
                
            } catch (error) {
                msgBox.className = 'message error';
                msgBox.textContent = error.message;
            } finally {
                btn.disabled = false;
                btn.textContent = currentMode === 'signin' ? 'Sign In' : 'Create Account';
            }
        }
    </script>
</body>
</html>
